name: Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "packages/**"
      - "scripts/workspace-aliases.mjs"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "packages/**"
      - "scripts/workspace-aliases.mjs"
      - "deno.json"
      - "deno.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/configure-pages@v5
        id: pages
      - run: deno task build:site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
