name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep the newest validation for a PR or main; stale runs consume software-GPU
# runner time without providing a merge signal.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test
      - run: deno task typecheck
      - run: deno task typecheck:components
      - run: deno task typecheck:site
      - run: deno task check:hardening
      - run: deno task jsr:check

  webgpu-suites:
    strategy:
      fail-fast: false
      matrix:
        group: [site, retirement, efield, invalidation, viewer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # SwiftShader: skip hardware throughput timing (correctness still runs).
      MOLGPU_SKIP_TIMING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Chrome
        run: |
          for attempt in 1 2 3; do
            deno run -A npm:playwright@1.62.1 install --with-deps chrome && exit 0
            echo "Chrome install failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          exit 1
      - name: WebGPU browser suites
        env:
          SUITE_GROUP: ${{ matrix.group }}
          MOLGPU_RETIREMENT_OUTPUT_DIR: ${{ runner.temp }}/molgpu-retirement
        run: bash scripts/run-webgpu-ci.sh
      - name: Retain GPU retirement evidence
        if: always() && matrix.group == 'retirement'
        uses: actions/upload-artifact@v4
        with:
          name: gpu-retirement-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/molgpu-retirement
          if-no-files-found: warn

  # Preserve the existing required check name while requiring every group.
  webgpu:
    if: always()
    needs: webgpu-suites
    runs-on: ubuntu-latest
    steps:
      - name: Require all WebGPU groups
        env:
          RESULT: ${{ needs.webgpu-suites.result }}
        run: test "$RESULT" = success
