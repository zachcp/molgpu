name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep the newest validation for a PR or main; stale runs consume software-GPU
# runner time without providing a merge signal.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt
      - run: deno task lint
      - run: deno task test
      - run: deno task typecheck
      - run: deno task typecheck:components
      - run: deno task typecheck:site
      - run: deno task check:hardening
      - run: deno task jsr:check

  webgpu-suites:
    strategy:
      fail-fast: false
      matrix:
        group: [site, retirement, efield, invalidation, viewer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # SwiftShader: skip hardware throughput timing (correctness still runs).
      MOLGPU_SKIP_TIMING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run -A npm:playwright@1.62.1 install --with-deps chrome
      - name: WebGPU browser suites
        env:
          SUITE_GROUP: ${{ matrix.group }}
        run: bash scripts/run-webgpu-ci.sh

  # Preserve the existing required check name while requiring every group.
  webgpu:
    if: always()
    needs: webgpu-suites
    runs-on: ubuntu-latest
    steps:
      - name: Require all WebGPU groups
        env:
          RESULT: ${{ needs.webgpu-suites.result }}
        run: test "$RESULT" = success
