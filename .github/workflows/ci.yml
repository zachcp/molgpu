name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt
      - run: deno task test
      - run: deno task typecheck
      - run: deno task check:hardening
      - run: deno task jsr:check

  webgpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run -A npm:playwright@1.62.1 install --with-deps chrome
      - name: WebGPU browser suites
        run: |
          failed=()
          for suite in packages/viewer/test/run-*.mjs \
            packages/fields/test/run-browser.mjs; do
            echo "::group::$suite"
            deno test -A "$suite" || failed+=("$suite")
            echo "::endgroup::"
          done
          if ((${#failed[@]})); then
            printf '::error::failed: %s\n' "${failed[@]}"
            exit 1
          fi
