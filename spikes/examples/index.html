<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>use.gpu layer examples</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f13;color:#e4e9f2;
    font:13px/1.5 ui-monospace,Menlo,monospace}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid #232935}
  #title{font-weight:600;color:#cfe3f8}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:#8d97a8;text-decoration:none;padding:4px 8px;border:1px solid #232935;border-radius:3px}
  nav a:hover{color:#e4e9f2;border-color:#39424f}
  nav a[aria-current=page]{background:#17293c;border-color:#7fb2e5;color:#cfe3f8}
  #stage{flex:1;position:relative;min-height:0}
  #stage canvas{display:block;width:100%;height:100%}
  #err{position:absolute;left:12px;bottom:12px;color:#c98a9e;max-width:calc(100% - 24px)}
</style></head><body>
<header>
  <span id="title">…</span>
  <nav>
    <a data-ex="points"   href="?ex=points">points</a>
    <a data-ex="lines"    href="?ex=lines">lines</a>
    <a data-ex="trace"    href="?ex=trace">trace</a>
    <a data-ex="faces"    href="?ex=faces">faces</a>
    <a data-ex="material" href="?ex=material">material</a>
    <a data-ex="labels"   href="?ex=labels">labels</a>
  </nav>
</header>
<div id="stage"><div id="err"></div></div>
<script type="module" src="./main.mjs"></script>
</body></html>
