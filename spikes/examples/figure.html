<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,">
<title>Phase 5 figure — appearance & interaction</title>
<style>
  /* overflow:hidden is load-bearing (see index.html): it breaks the canvas /
     scrollbar resize-thrash loop that reallocates the picking readback buffer. */
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0f13;color:#e4e9f2;
    font:13px/1.5 ui-monospace,Menlo,monospace}
  body{display:flex;flex-direction:column}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid #232935}
  #title{font-weight:600;color:#cfe3f8}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:#8d97a8;text-decoration:none;padding:4px 8px;border:1px solid #232935;border-radius:3px}
  nav a:hover{color:#e4e9f2;border-color:#39424f}
  nav a[aria-current=page]{background:#17293c;border-color:#7fb2e5;color:#cfe3f8}
  #toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid #232935}
  #hover{color:#a9c7e8}
  #stage{flex:1;position:relative;min-height:0;overflow:hidden}
  #stage canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  #err{position:absolute;left:12px;bottom:12px;color:#c98a9e;max-width:calc(100% - 24px)}
</style></head><body>
<header>
  <span id="title">Phase 5 — appearance &amp; interaction (crambin)</span>
  <nav>
    <a href="index.html">◀ gallery</a>
    <a href="figure.html" aria-current="page">figure</a>
  </nav>
</header>
<div id="toolbar">
  <label for="scrub">Scrub</label>
  <input id="scrub" type="range" min="0" max="4" step="0.01" value="0" aria-label="Timeline time in seconds">
  <output id="beat" for="scrub">0.00 s · overview</output>
  <span id="hover">hover an atom of the sulfur sites</span>
</div>
<div id="stage"><div id="err"></div></div>
<script type="module" src="./figure.mjs"></script>
</body></html>
